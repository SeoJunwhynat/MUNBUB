# Render Blueprint for a new service. For an existing service, set the same build/start commands.
services:
  - type: web
    name: matchunbeom
    runtime: node
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
