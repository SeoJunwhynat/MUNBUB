<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="refresh" content="4;url=/">
<title>맛춘범 | 새 사이트로 이전했습니다</title>
<style>
  :root{color-scheme:dark;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;
    font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;
    background:radial-gradient(ellipse at 30% 15%,#483d40 0%,#19141a 44%,#0c0b10 100%);color:#f9efda}
  .frame{max-width:540px;width:100%;padding:clamp(24px,5vw,46px);
    border:2px solid #be9c70;box-shadow:0 0 0 5px #211b1e,0 20px 75px #0008;
    background:linear-gradient(145deg,#282129,#16141a);text-align:center;border-radius:15px}
  .stamp{display:inline-flex;align-items:center;justify-content:center;
    color:#f1dcb6;background:#62494a;border:1px solid #b58a75;
    border-radius:999px;font-size:14px;padding:7px 17px;font-weight:800}
  h1{font-size:clamp(27px,6vw,40px);line-height:1.35;letter-spacing:-.045em;margin:25px 0 14px}
  p{color:#d1c1b6;font-size:16px;line-height:1.75;margin:0 0 24px}
  a{display:block;text-decoration:none;background:#ecd7ae;color:#27212a;font-weight:900;
    padding:16px;border-radius:10px;box-shadow:inset 0 -4px #c6a77a}
  .small{font-size:13px;color:#bcaaa0;margin-top:20px}
  .bar{height:6px;margin-top:25px;border-radius:6px;background:#423839;overflow:hidden}
  .bar::before{content:"";display:block;height:100%;background:#d3b88a;animation:fill 4s linear forwards}
  @keyframes fill{from{width:0}to{width:100%}}
  @media(prefers-reduced-motion:reduce){.bar::before{animation:none;width:100%}}
</style>
</head>
<body>
<main class="frame">
  <span class="stamp">맛춘범 · 새 주소 안내</span>
  <h1>맛춘범이 새 사이트로<br>이전되었습니다!</h1>
  <p>더 안정적인 서버에서 게임을 계속 즐길 수 있어요.<br>
     잠시 후 새 맛춘범 홈페이지로 자동 이동합니다.</p>
  <a href="/">새로운 맛춘범 바로가기</a>
  <div class="bar" aria-hidden="true"></div>
  <p class="small">4초 후 자동 이동 · 이동하지 않으면 위 버튼을 눌러 주세요.</p>
</main>
<script>setTimeout(()=>{location.replace("/")},4000);</script>
</body>
</html>
