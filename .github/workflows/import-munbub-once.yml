name: Import existing MUNBUB source
on:
  push:
    paths:
      - '.github/workflows/import-munbub-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Copy existing project safely
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/whynat0517/MUNBUB.git "$RUNNER_TEMP/old-munbub"
          test -f "$RUNNER_TEMP/old-munbub/index.html"
          test -f "$RUNNER_TEMP/old-munbub/api/duel.js"
          test -d "$RUNNER_TEMP/old-munbub/ui-assets"
          rsync -a --exclude '.git/' --exclude '.github/workflows/' "$RUNNER_TEMP/old-munbub/" "$GITHUB_WORKSPACE/"
          test -f index.html
          test -f api/duel.js
          test -d ui-assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import complete MUNBUB game from whynat0517/main"
            git push origin HEAD:main
          fi
